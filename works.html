    <style>
        /* ========== Page Layout ========== */
        .works-content {
            position: relative;
            z-index: 2;
            padding-top: calc(var(--nav-height) + 64px);
            padding-bottom: 80px;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(48px, 7vw, 72px);
            text-align: center;
            margin-bottom: 64px;
            background: linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0.80) 50%, rgba(255,255,255,0.50) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ========== Section ========== */
        .work-section {
            margin-bottom: 64px;
        }

        .work-section:last-child {
            margin-bottom: 0;
        }

        .section-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
        }

        .section-tag {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .section-heading {
            font-family: var(--font-display);
            font-size: clamp(28px, 5vw, 40px);
            background: linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0.75) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ========== Video Grid ========== */
        .video-grid {
            display: grid;
            gap: 24px;
        }

        .video-grid.two {
            grid-template-columns: repeat(2, 1fr);
        }

        .video-grid.one {
            max-width: 640px;
            margin: 0 auto;
        }

        /* ========== Video Card ========== */
        .video-card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition:
                transform var(--duration-normal) var(--ease-expo),
                border-color var(--duration-normal) var(--ease-expo),
                box-shadow var(--duration-normal) var(--ease-expo);
        }

        .video-card:hover,
        .video-card:focus-visible {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-card-hover);
            outline: none;
        }

        .video-card-media {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        .video-card-media .cover {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Play button overlay */
        .play-btn {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .play-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(4px);
            transition:
                transform var(--duration-fast) var(--ease-expo),
                background var(--duration-fast) var(--ease-expo),
                box-shadow var(--duration-fast) var(--ease-expo);
        }

        .video-card:hover .play-icon {
            transform: scale(1.1);
            background: rgba(94, 106, 210, 0.45);
            box-shadow: 0 0 24px rgba(94, 106, 210, 0.45);
        }

        .video-card-body {
            padding: 16px 20px 20px;
        }

        .video-card-body h3 {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--foreground);
            transition: color var(--duration-fast) var(--ease-expo);
        }

        .video-card:hover .video-card-body h3 {
            color: var(--accent);
        }

        /* ========== Lightbox Modal ========== */
        .video-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition:
                opacity var(--duration-normal) var(--ease-expo),
                visibility var(--duration-normal) var(--ease-expo);
        }

        .video-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 3;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--border-default);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                border-color var(--duration-fast) var(--ease-expo),
                background var(--duration-fast) var(--ease-expo),
                box-shadow var(--duration-fast) var(--ease-expo);
        }

        .modal-close:hover {
            border-color: var(--border-accent);
            background: rgba(94, 106, 210, 0.25);
            box-shadow: 0 0 20px rgba(94, 106, 210, 0.35);
        }

        .modal-video-wrap {
            position: relative;
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        .modal-video-wrap video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ========== Responsive ========== */
        @media (max-width: 767px) {
            .works-content {
                padding-top: calc(var(--nav-height) + 40px);
                padding-left: 16px;
                padding-right: 16px;
            }

            .page-title {
                font-size: clamp(36px, 10vw, 48px);
                margin-bottom: 48px;
            }

            .video-grid.two {
                grid-template-columns: 1fr;
            }

            .video-card-body h3 {
                font-size: 16px;
            }

            .video-modal {
                padding: 12px;
            }

            .modal-close {
                top: 12px;
                right: 12px;
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

    <script src="assets/scripts/main.js"></script>
    <script>
        (function () {
            const cards = document.querySelectorAll('.video-card');
            const modal = document.getElementById('videoModal');
            const modalVideo = document.getElementById('modalVideo');
            const closeBtn = document.getElementById('modalClose');

            function openModal(src) {
                modalVideo.src = src;
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                modalVideo.play().catch(function () {});
            }

            function closeModal() {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
                modalVideo.pause();
                modalVideo.removeAttribute('src');
                modalVideo.load();
            }

            cards.forEach(function (card) {
                card.addEventListener('click', function () {
                    const src = card.getAttribute('data-video');
                    if (src) openModal(src);
                });
                card.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        const src = card.getAttribute('data-video');
                        if (src) openModal(src);
                    }
                });
            });

            closeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closeModal();
            });

            modal.addEventListener('click', function (e) {
                if (e.target === modal) closeModal();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
            });
        })();
    </script>
