<head>

    <style>
        /* ========== Page Layout ========== */
        .contact-content {
            position: relative;
            z-index: 2;
            padding-top: calc(var(--nav-height) + 64px);
            padding-bottom: 80px;
            max-width: 700px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(48px, 7vw, 72px);
            text-align: center;
            margin-bottom: 56px;
            background: linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0.80) 50%, rgba(255,255,255,0.50) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ========== Contact List ========== */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .contact-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            background: linear-gradient(to right, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition:
                transform var(--duration-normal) var(--ease-expo),
                border-color var(--duration-normal) var(--ease-expo),
                box-shadow var(--duration-normal) var(--ease-expo);
        }

        .contact-card:hover {
            transform: translateX(4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-card-hover);
        }

        /* Spotlight overlay */
        .contact-spotlight {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(
                300px circle at var(--spotlight-x, 50%) var(--spotlight-y, 50%),
                rgba(94, 106, 210, 0.10),
                transparent 70%
            );
            transition: opacity var(--duration-fast) var(--ease-expo);
        }

        .contact-card:hover .contact-spotlight {
            opacity: 1;
        }

        /* Icon container */
        .c-icon {
            position: relative;
            z-index: 2;
            width: 52px;
            height: 52px;
            border-radius: var(--radius-lg);
            background: var(--surface);
            border: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            transition:
                border-color var(--duration-fast) var(--ease-expo),
                box-shadow var(--duration-fast) var(--ease-expo);
        }

        .contact-card:hover .c-icon {
            border-color: var(--border-accent);
            box-shadow: 0 0 20px var(--accent-glow-soft);
        }

        /* Info */
        .c-info {
            position: relative;
            z-index: 2;
        }

        .c-info h3 {
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 2px;
        }

        .c-info span {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--foreground-muted);
        }

        /* ========== Contact Form ========== */
        .form-card {
            position: relative;
            padding: 32px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card);
        }

        /* Accent line at top */
        .form-card::before {
            content: '';
            display: block;
            width: 48px;
            height: 2px;
            border-radius: 1px;
            background: var(--accent);
            margin-bottom: 24px;
            opacity: 0.5;
        }

        .form-card h2 {
            font-family: var(--font-display);
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
            color: var(--foreground-muted);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #0F0F12;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: var(--radius-md);
            color: var(--foreground);
            font-family: var(--font-ui);
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            transition:
                border-color var(--duration-fast) var(--ease-expo),
                box-shadow var(--duration-fast) var(--ease-expo);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(94, 106, 210, 0.40);
            box-shadow:
                0 0 0 3px rgba(94, 106, 210, 0.12),
                0 0 20px rgba(94, 106, 210, 0.05);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            letter-spacing: 0.01em;
            box-shadow:
                0 0 0 1px rgba(94,106,210,0.40),
                0 4px 12px rgba(94,106,210,0.25),
                inset 0 1px 0 0 rgba(255,255,255,0.15);
            transition:
                background var(--duration-fast) var(--ease-expo),
                box-shadow var(--duration-normal) var(--ease-expo),
                transform var(--duration-fast) var(--ease-expo);
        }

        .btn-submit:hover {
            background: var(--accent-bright);
            box-shadow:
                0 0 0 1px rgba(94,106,210,0.50),
                0 6px 20px rgba(94,106,210,0.35),
                inset 0 1px 0 0 rgba(255,255,255,0.20);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ========== Responsive ========== */
        @media (max-width: 767px) {
            .contact-content {
                padding-top: calc(var(--nav-height) + 40px);
                padding-left: 16px;
                padding-right: 16px;
            }

            .page-title {
                font-size: clamp(36px, 10vw, 48px);
                margin-bottom: 40px;
            }

            .contact-card {
                padding: 16px 18px;
                gap: 14px;
            }

            .c-icon {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .form-card {
                padding: 22px;
            }

            .form-card h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
